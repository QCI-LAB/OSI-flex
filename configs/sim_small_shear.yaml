# Paths to input images
input_images:
  - "data/simulation/small_shear/img1.tif"
  - "data/simulation/small_shear/img2.tif"

# Two-element shifts for each image
shears:
  - [0.8, 0]
  - [0, 0.8]

# Algorithm parameters
max_iter: 800

# Regularization coefficients
tv_coeff: 1e-8
sign_reg_coeff: 1e-8 # positive coeff -> nonnegativity constraint

# shift fine-tuning
shear_lr: 0  # set to 0 to skip fine-tuning

# Optimizer settings
opti_method: "Adam"
learning_rate: 0.1
