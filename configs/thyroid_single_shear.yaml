# Paths to input images
input_images:
  - "data/thyroid/img1.tif"
#  - "data/thyroid/img2.tif"

# Two-element shifts for each image
shears:
 - [-2.0, -2.9]
# - [-3.7, 1.5]

# Algorithm parameters
max_iter: 400

# Regularization coefficients
tv_coeff: 1e-8
sign_reg_coeff: 2e-8

# shift fine-tuning
shear_lr: 0.0  # set to 0 to skip fine-tuning

# Optimizer settings
opti_method: "Adam"
learning_rate: 0.1
